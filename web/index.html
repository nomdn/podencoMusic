<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- SEO：<title> 保持 Podenco Music，塞壬唱片 / 明日方舟 / 下载器等关键词放描述里 -->
  <meta name="description" content="Podenco Music 是塞壬唱片（Monster Siren Records）非官方音乐播放器与下载器：在线试听明日方舟游戏音乐、查看歌词、免费下载歌曲，提供网页版与 Windows / Linux / 安卓客户端。">
  <meta name="keywords" content="Podenco Music,塞壬唱片,Monster Siren,明日方舟,Arknights,音乐下载器,音乐播放器,游戏音乐">

  <!-- Open Graph / Twitter Card：分享到聊天软件与社交平台时的卡片信息 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Podenco Music">
  <meta property="og:title" content="Podenco Music - 塞壬唱片（明日方舟）音乐播放器与下载器">
  <meta property="og:description" content="在线试听与免费下载明日方舟塞壬唱片全部歌曲，支持歌词显示；网页版开箱即用，另有 Windows / Linux / 安卓客户端。">
  <!-- og:image 用绝对地址才能在各平台的分享卡片里显示：站点域名确定后替换为完整 URL，
       例如 https://<你的域名>/icons/Icon-512.png -->
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- hycdn OSS 开了 Referer 防盗链：外部 Referer 一律 403，空 Referer 放行。
       原生端不发 Referer 所以一直没事；Web 端在这里全局禁掉 Referer，
       否则封面 / 音频 / 歌词全会被防盗链拦下。 -->
  <meta name="referrer" content="no-referrer">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Podenco Music">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Podenco Music</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 爬虫（如百度）不执行 JS：留一段可直接抓取的正文 -->
  <noscript>
    Podenco Music 是塞壬唱片（Monster Siren Records，明日方舟游戏音乐厂牌）的非官方音乐播放器与下载器，
    支持在线试听、歌词显示与歌曲下载，提供 Windows / Linux / 安卓客户端；网页版需要启用 JavaScript。
  </noscript>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
