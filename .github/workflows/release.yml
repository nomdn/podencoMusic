name: release

# 打 v* 标签 → 静态检查/测试 → 四平台客户端构建 + 反代二进制/Docker 镜像（GHCR）
#              → 发布 Release + 部署 Web 到 EdgeOne Pages；
# 手动触发（Actions 页 / workflow_dispatch）→ 构建产物在 Actions 页下载。
# 检查与测试只在 check job 跑一次（复用 check.yml），四个平台不再各跑一遍。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 静态检查 + 测试只做一次，四个平台构建共用结果（定义在 check.yml，
  # PR / push main 时也会单独跑同一份）
  check:
    name: Analyze & Test
    uses: ./.github/workflows/check.yml

  build:
    name: Build (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux-x64
            arch: x64
          - os: ubuntu-latest
            target: web
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # 版本以 tag 为准：就地改 pubspec.yaml，让下游全部自动跟随
      #   · Android  versionName / versionCode（gradle 读 flutter.versionName）
      #   · Windows  Runner.rc 的 FileVersion（CMake 读 generated_config.cmake）
      #   · Linux    build_packages.sh 从同一个 version 字段取包版本
      # `+N` 是 Android 的 versionCode，必须单调递增；tag 的 semver 表达不了，
      # 用 run_number（同一仓库内只增不减）。手动触发没有 tag，跳过这步、
      # 沿用 pubspec 里手写的版本。
      - name: 版本注入（tag → pubspec.yaml）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # 形如 1.2.3、1.2.3-rc.1；出现别的字符立刻停下，别让脏版本进包。
          # 不允许 tag 自带 `+build`：versionCode 要由后面拼的 +N 提供，
          # 两个加号会拼出 1.0.2+meta+42 这种非法版本号。
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag 不是合法 semver：$GITHUB_REF_NAME" >&2
            exit 1
          fi
          sed -i -E "s/^version:.*/version: ${VERSION}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          grep -n '^version:' pubspec.yaml

      # Android 构建要 JDK 17；Windows 装一份无害
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 版本钉死：pubspec 要求 Dart ^3.14（Flutter 3.50+）
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Linux 构建与打包依赖（GTK3 / ninja / ayatana / GStreamer / libmpv / rpm / Flatpak）
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          # libmpv-dev 是编译期必需：media_kit_video 的 Linux CMakeLists 里
          # `pkg_check_modules(mpv IMPORTED_TARGET mpv)` 不是 REQUIRED，
          # 缺 mpv.pc 时它静默失败、不生成 PkgConfig::mpv，随后
          # target_link_libraries 才报 “target was not found”；
          # libmpv2 只提供运行时的 libmpv.so.2（Flatpak 收集依赖也要它）。
          sudo apt-get install -y \
            libgtk-3-dev ninja-build pkg-config libayatana-appindicator3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            libmpv2 libmpv-dev rpm zstd flatpak flatpak-builder

      - name: 拉依赖
        run: flutter pub get

      # Gradle 依赖（AndroidX / media3 / AGP）每次全拉要几分钟，
      # flutter-action 的缓存只管 pub 和 Flutter SDK，这里单独缓存 Gradle 用户目录；
      # 命中后 Android 构建通常从 5~8 分钟降到 2 分钟左右。
      - name: 缓存 Gradle 依赖
        if: matrix.target == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 构建 Android APK（按 ABI 拆分）
        if: matrix.target == 'android'
        run: |
          # 三 ABI 各出一个包：通用包 52MB，拆开后 arm64 只有 18MB。
          # 现代手机基本都是 arm64-v8a；v7a 给老机器，x86_64 给模拟器。
          flutter build apk --release --split-per-abi
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk   "$GITHUB_WORKSPACE/podencoMusic-android-arm64.apk"
          mv app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/podencoMusic-android-armv7a.apk"
          mv app-x86_64-release.apk      "$GITHUB_WORKSPACE/podencoMusic-android-x86_64.apk"

      - name: 构建 Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

      # Release 目录整体打包：exe + dll + data 一个都不能少
      - name: 打包 Windows 产物
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath podencoMusic-windows.zip -Force

      - name: 构建 Linux
        if: startsWith(matrix.target, 'linux')
        run: |
          flutter build linux --release
          tar -czf podencoMusic-${{ matrix.target }}.tar.gz -C build/linux/${{ matrix.arch }}/release/bundle .

      - name: 打包 Linux 系统包（deb / rpm / Arch）
        if: startsWith(matrix.target, 'linux')
        run: bash build_packages.sh

      # 海外 runner 直连官方 Flathub；国内本地可用 FLATHUB_URL 覆盖为镜像
      - name: 打包 Flatpak（官方 Flathub）
        if: startsWith(matrix.target, 'linux')
        env:
          FLATHUB_REMOTE: flathub-ci
          FLATHUB_URL: https://dl.flathub.org/repo/
        run: bash build_flatpak.sh

      # Web 产物是纯静态文件，任何静态托管解压即用
      - name: 构建 Web 并打包
        if: matrix.target == 'web'
        run: |
          flutter build web --release
          cd build/web
          zip -qr ../../podencoMusic-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: podencoMusic-${{ matrix.target }}
          path: |
            podencoMusic-android-arm64.apk
            podencoMusic-android-armv7a.apk
            podencoMusic-android-x86_64.apk
            podencoMusic-windows.zip
            podencoMusic-linux-x64.tar.gz
            podencoMusic-web.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.target, 'linux')
        with:
          name: podencoMusic-linux-packages
          path: |
            build/linux/packages/*.deb
            build/linux/packages/*.rpm
            build/linux/packages/*.pkg.tar.zst
            build/linux/packages/*.flatpak
          if-no-files-found: error

  # 反代（Go）单独构建：二进制进 Release，Docker 镜像推到 GitHub Container Registry
  build-proxy:
    name: Build Proxy (binary + GHCR image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 反代测试
        working-directory: server
        run: go test ./...

      - name: 构建反代二进制
        working-directory: server
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o biliproxy-linux-amd64 .

      - uses: actions/upload-artifact@v4
        with:
          name: podencoMusic-proxy
          path: server/biliproxy-linux-amd64
          if-no-files-found: error

      # GHCR 要求镜像名全小写，owner 可能含大写
      - name: 计算镜像名
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/podenco-music-proxy" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          # 只在 tag 或默认分支推送；手动触发只做本地构建校验
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          build-args: GOPROXY=https://proxy.golang.org,direct
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Web 版部署到腾讯云 EdgeOne Pages（官方 CLI：npx edgeone pages deploy）
  # 需要仓库 Secret：EDGEONE_API_TOKEN（EdgeOne Pages 控制台创建）
  deploy-eo-pages:
    name: Deploy Web to EdgeOne Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - uses: actions/download-artifact@v4
        with:
          name: podencoMusic-web
          path: web-dist

      - name: 解压 Web 产物
        run: unzip web-dist/podencoMusic-web.zip -d web-dist

      - name: 部署到 EdgeOne Pages
        run: npx edgeone pages deploy ./web-dist -n podenco-music -t ${{ secrets.EDGEONE_API_TOKEN }}

  release:
    # 只有 tag 推送才发 Release；手动触发只构建（产物在 Actions 页下载）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-proxy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: podencoMusic-android
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: podencoMusic-windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: podencoMusic-linux-x64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: podencoMusic-web
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: podencoMusic-linux-packages
          path: dist/packages

      - uses: actions/download-artifact@v4
        with:
          name: podencoMusic-proxy
          path: dist/proxy

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            dist/packages/*
            dist/proxy/*
          generate_release_notes: true
