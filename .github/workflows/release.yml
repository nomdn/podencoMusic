name: release

# 打 v* 标签 → 四平台构建 + 发布 Release + 部署 Web 到 EdgeOne Pages；
# 手动触发（Actions 页 / workflow_dispatch）→ 构建产物在 Actions 页下载。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux-x64
            arch: x64
          - os: ubuntu-latest
            target: web
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Android 构建要 JDK 17；Windows 装一份无害
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 版本钉死：pubspec 要求 Dart ^3.14（Flutter 3.50+）
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Linux 构建依赖（GTK3 / ninja / ayatana / GStreamer）
        if: startsWith(matrix.target, 'linux')
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build pkg-config libayatana-appindicator3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: 拉依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 单元测试
        run: flutter test

      - name: 构建 Android APK
        if: matrix.target == 'android'
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk podencoMusic-android.apk

      - name: 构建 Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

      # Release 目录整体打包：exe + dll + data 一个都不能少
      - name: 打包 Windows 产物
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath podencoMusic-windows.zip -Force

      - name: 构建 Linux
        if: startsWith(matrix.target, 'linux')
        run: |
          flutter build linux --release
          tar -czf podencoMusic-${{ matrix.target }}.tar.gz -C build/linux/${{ matrix.arch }}/release/bundle .

      # Web 产物是纯静态文件，任何静态托管解压即用
      - name: 构建 Web 并打包
        if: matrix.target == 'web'
        run: |
          flutter build web --release
          cd build/web
          zip -qr ../../..//podencoMusic-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: podencoMusic-${{ matrix.target }}
          path: |
            podencoMusic-android.apk
            podencoMusic-windows.zip
            podencoMusic-linux-x64.tar.gz
            podencoMusic-web.zip
          if-no-files-found: error

  # Web 版部署到腾讯云 EdgeOne Pages（官方 CLI：npx edgeone pages deploy）
  # 需要仓库 Secret：EDGEONE_API_TOKEN（EdgeOne Pages 控制台创建）
  deploy-eo-pages:
    name: Deploy Web to EdgeOne Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - uses: actions/download-artifact@v4
        with:
          name: podencoMusic-web
          path: web-dist

      - name: 解压 Web 产物
        run: unzip web-dist/podencoMusic-web.zip -d web-dist

      - name: 部署到 EdgeOne Pages
        run: npx edgeone pages deploy ./web-dist -n podenco-music -t ${{ secrets.EDGEONE_API_TOKEN }}

  release:
    # 只有 tag 推送才发 Release；手动触发只构建（产物在 Actions 页下载）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: podencoMusic-android
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: podencoMusic-windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: podencoMusic-linux-x64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: podencoMusic-web
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
